name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            25

      - name: Build and test
        run: ./gradlew test :plugin-legacy:shadowJar :plugin-paper:shadowJar --no-daemon

      - name: Upload plugin JARs
        uses: actions/upload-artifact@v4
        with:
          name: blaze-vortex-jars
          path: |
            plugin-legacy/build/libs/BlazeVortex-legacy-1.0.0.jar
            plugin-paper/build/libs/BlazeVortex-paper-1.0.0.jar
